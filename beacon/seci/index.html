<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SC Encoding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Restricted Information</h1>

    <label>String:</label>
    <textarea id="inputText" placeholder="Enter text..."></textarea>

    <label>Seed:</label>
    <input type="number" id="seedInput" placeholder="Enter seed...">

    <input type="checkbox" id="decode" name="decode-checkbox" value="no">
    <label for="decode">Negate Shift</label>

    <button onclick="processText()">Encode / Decode</button>

    <h2>Output:</h2>
    <textarea id="outputText" readonly></textarea>
  </div>

  <script src="script.js"></script>
</body>
</html>
