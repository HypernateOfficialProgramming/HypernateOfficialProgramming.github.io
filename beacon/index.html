<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>BC - Access Gateway</title>
</head>
<body>

<div id="gate">
    <h1>Enter Gateway Key</h1>
    <input type="text" id="keyInput" placeholder="Enter key...">
    <button onclick="checkKey()">Access</button>
    <p id="status"></p>
</div>

<div id="main" style="display:none;">
    <div id="header-container"></div>

    <div id="center">
        <h1>The Beacon Coalition</h1>
        <p>We stand as a light in the chaos, uniting all worlds from across the universe for peace and progress.</p>
        <h2>Our Goal</h2>
        <p>We aim to unite the universes of existence, setting aside differences to build a fair and lasting union.</p>
    </div>

    <div id="controls">
        <audio id="bgm" loop>
            <source src="assets/BeaconCoalitionTheme.wav" type="audio/wav">
        </audio>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>
</div>

<script>
const storedHash = "ead5192dfaa0db61afbd47edbbc618f2dc5e683ec45a5027ea4b918f3745cb2a";

async function hashText(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(hashBuffer)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function checkKey() {
  const input = document.getElementById("keyInput").value.trim();

  const inputHash = await hashText(input);

  if (inputHash === storedHash) {
    // Unlock site
    document.getElementById("gate").style.display = "none";
    document.getElementById("main").style.display = "block";

    // Load header
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      });

    // Play music (now allowed because user interacted)
    const audio = document.getElementById("bgm");
    audio.volume = 0.5;
    audio.play();

  } else {
    document.body.innerHTML = "<h1 style='color:red;text-align:center;'>ACCESS DENIED</h1>";
  }
}
</script>

</body>
</html>
