<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>BC - Main Page</title>
</head>
<body>
    <div id="header-container"></div>
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            })
            .catch(err => console.error('Failed to load header:', err));
    </script>
    <div id="center">
        <h1>The Beacon Coalition</h1>
        <p>We stand as a light in the chaos, uniting all worlds from across the universe for peace and progress.</p>
        <h2>Our Goal</h2>
        <p>We aim to unite the universes of existence, setting aside differences to build a fair and lasting union.</p></div>
    <div id="controls">
        <audio id="bgm" loop autoplay>
          <source src="assets/BeaconCoalitionTheme.wav" type="audio/wav">
        </audio>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
         <script src="js/music.js"></script>
        </div>
</body>
