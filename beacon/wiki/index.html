<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>BC - Wiki</title>
</head>
<body>
    <div id="header-container"></div>
    <script>
        fetch('../header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            })
            .catch(err => console.error('Failed to load header:', err));
    </script>
    <div id="center">
        <h1>Welcome to the Beacon Coalition!</h1>
        <p>Click on any of the portraits below to see the respective personnel's page.</p>
        
        <img src="../assets/personnel.png" alt="Beacon Coalition Personnel" usemap="#personnelmap" width="800">
    
        <map name="personnelmap">
            <area shape="rect" coords="28,189,75,236" href="https://hypernateofficialprogramming.github.io/beacon/wiki/2219/index.html" alt="2219 Aluminum Alloy">
            <area shape="rect" coords="77,189,124,236" href="https://hypernateofficialprogramming.github.io/beacon/wiki/As92/index.html" alt="Arsenic 92">
            <area shape="rect" coords="126,189,173,236" href="https://hypernateofficialprogramming.github.io/beacon/wiki/C18150/index.html" alt="C18150">
            <area shape="rect" coords="175,189,222,236" href="https://hypernateofficialprogramming.github.io/beacon/wiki/Ti46/index.html" alt="Minerva Unit 1 (Titanium 46)">
            <area shape="rect" coords="28,260,75,307" href="https://hypernateofficialprogramming.github.io/beacon/wiki/Zephyrus/index.html" alt="Zephyrus">
        </map>
    </div>
</body>
