    <h1>you are beautiful</h1>
  
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        const inconceivable = [
            "",
            "bold",
            "italic",
            "bold italic",
            "underline",
            "italic underline",
            "bold underline",
            "bold italic underline",
            "strike",
            "underline strike",
            "italic underline strike",
            "bold underline strike",
            "bold italic underline strike"
        ];

        const greaterWorld = document.getElementById("greater-world");
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const origin_vertices = new Float32Array([
             0.0,  1.0, 0.0,
            -1.0, -1.0, 0.0,
             1.0, -1.0, 0.0
        ]);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
        geometry.setAttribute(
            'position',
            new THREE.BufferAttribute(new Float32Array(origin_vertices), 3)
        );
        const triangle = new THREE.Mesh(geometry, material);
        scene.add(triangle);
        camera.position.z = 5;

        const position = geometry.attributes.position;

        function animate() {
            requestAnimationFrame(animate);
        
            triangle.rotation.y += 0.01;
            triangle.rotation.z += 0.005;
        
            for (let i = 0; i < position.array.length; i++) {
                position.array[i] = origin_vertices[i] + (Math.random() - 0.5) * 0.1;
            }
        
            position.needsUpdate = true;
            renderer.render(scene, camera);

            greaterWorld.className = inconceivable[Math.floor(Math.random() * inconceivable.length)];
            
            greaterWorld.textContent = "?";
            lastChange = time;
        };

        animate()
    </script>
